<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        width: 280px;
        padding: 14px;
        background: #141417;
        color: #f2f2f4;
        font: 13px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      .brand { display: flex; align-items: center; gap: 8px; margin-bottom: 2px; }
      .brand img { display: block; border-radius: 5px; }
      h1 { font-size: 13px; margin: 0; font-weight: 650; }
      p.hint { margin: 0; color: #9a9aa3; font-size: 12px; }
      p.subtitle { margin: 3px 0 0; color: #9a9aa3; font-size: 11.5px; line-height: 1.45; }
      p.hint.spaced { margin: 6px 0 0; }
      .field { margin: 9px 0 0; color: #b7b7bf; font-size: 12px; }
      .field .label { display: block; margin-bottom: 3px; }
      .field .range { display: flex; align-items: center; gap: 6px; color: #9a9aa3; }
      .inline { display: flex; align-items: center; gap: 6px; margin-top: 9px; color: #b7b7bf; font-size: 12px; }
      .inline .label { flex: 0 0 auto; }
      .inline .unit { color: #9a9aa3; }
      input[type="number"] {
        box-sizing: border-box;
        width: 64px;
        height: 26px;
        padding: 0 6px;
        border-radius: 7px;
        border: 1px solid #2e2e34;
        background: #1c1c21;
        color: #f2f2f4;
        font: inherit;
        font-size: 12px;
        text-align: center;
      }
      input[type="text"]:disabled { cursor: not-allowed; }
      input[type="text"] {
        box-sizing: border-box;
        width: 100%;
        height: 26px;
        padding: 0 8px;
        border-radius: 7px;
        border: 1px solid #2e2e34;
        background: #1c1c21;
        color: #f2f2f4;
        font: inherit;
        font-size: 12px;
      }
      input[type="checkbox"] { width: 14px; height: 14px; margin: 0; accent-color: #d93a3f; flex: 0 0 auto; }
      .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 7px 8px; margin-top: 10px; }
      .check { display: flex; align-items: center; gap: 7px; color: #d8d8de; font-size: 12px; }
      .check label { margin: 0; }
      .divider { height: 1px; margin: 12px 0 0; background: #26262c; }
      .actions { display: flex; gap: 8px; margin-top: 12px; }
      button {
        flex: 1;
        height: 30px;
        border-radius: 9px;
        border: 1px solid #3a3a42;
        background: #232329;
        color: #fff;
        font: 600 12.5px/1 inherit;
        cursor: pointer;
      }
      button:hover { background: #2c2c34; }
      button.ghost { font-weight: 500; color: #c9c9d1; background: #1c1c21; }
      button.ghost:hover { background: #26262c; }
      #status { margin-top: 7px; font-size: 11.5px; color: #8b8b93; min-height: 14px; word-break: break-word; }
    </style>
  </head>
  <body>
    <div class="brand">
      <img src="assets/icon-48.png" width="26" height="26" alt="" />
      <h1>Grok Library Cleaner</h1>
    </div>
    <p class="subtitle">Before deleting your account and leaving Grok, download and wipe your creations.</p>

    <div class="field">
      <span class="label">Wait between deletes</span>
      <div class="range">
        <input id="minDelay" type="number" min="300" step="50" aria-label="Fewest milliseconds between deletes" />
        <span>to</span>
        <input id="maxDelay" type="number" min="300" step="50" aria-label="Most milliseconds between deletes" />
        <span>ms</span>
      </div>
    </div>

    <div class="field">
      <span class="label">Long break every</span>
      <div class="range">
        <input id="every" type="number" min="2" step="1" aria-label="Fewest items between long breaks" />
        <span>to</span>
        <input id="everyMax" type="number" min="2" step="1" aria-label="Most items between long breaks" />
        <span>items</span>
      </div>
    </div>

    <div class="field">
      <span class="label">Break length</span>
      <div class="range">
        <input id="pause" type="number" min="1000" step="250" aria-label="Shortest long break in milliseconds" />
        <span>to</span>
        <input id="pauseMax" type="number" min="1000" step="250" aria-label="Longest long break in milliseconds" />
        <span>ms</span>
      </div>
    </div>

    <div class="inline">
      <span class="label">Delete at most</span>
      <input id="maxPerRun" type="number" min="0" step="10" aria-label="Most items per run, 0 for no limit" />
      <span class="unit">per run</span>
    </div>

    <div class="inline">
      <span class="label">Skip files larger than</span>
      <input id="maxSizeMB" type="number" min="0" step="0.5" aria-label="Skip files larger than this many megabytes, 0 for no limit" />
      <span class="unit">MB</span>
    </div>
    <p class="hint spaced">0 means no limit on either cap.</p>

    <div class="grid2">
      <div class="check">
        <input id="includePlain" type="checkbox" />
        <label for="includePlain">Images</label>
      </div>
      <div class="check">
        <input id="includeEdited" type="checkbox" />
        <label for="includeEdited">Edited</label>
      </div>
      <div class="check">
        <input id="includeVideos" type="checkbox" />
        <label for="includeVideos">Videos</label>
      </div>
      <div class="check">
        <input id="includeOther" type="checkbox" />
        <label for="includeOther">Other files</label>
      </div>
    </div>

    <div class="divider"></div>

    <div class="check" style="margin-top: 11px">
      <input id="downloadFirst" type="checkbox" />
      <label for="downloadFirst">Save a copy before deleting</label>
    </div>

    <div class="field">
      <span class="label">Save into this folder, inside Downloads</span>
      <input id="folder" type="text" spellcheck="false" placeholder="(no subfolder)" aria-label="Folder name inside the Downloads folder, leave empty to save straight into Downloads" />
    </div>

    <div class="check" style="margin-top: 9px">
      <input id="savePrompts" type="checkbox" checked />
      <label for="savePrompts">Save the prompt as a .md beside each file</label>
    </div>

    <div class="actions">
      <button id="save">Save</button>
      <button id="selftest" class="ghost">Test download</button>
    </div>
    <div id="status"></div>

    <script src="popup.js"></script>
  </body>
</html>
