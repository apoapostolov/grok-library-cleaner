<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        width: 280px;
        padding: 14px;
        background: #141417;
        color: #f2f2f4;
        font: 13px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      .brand { display: flex; align-items: center; gap: 8px; margin-bottom: 2px; }
      .brand img { display: block; border-radius: 5px; }
      h1 { font-size: 13px; margin: 0; font-weight: 650; }
      p.hint { margin: 0 0 12px; color: #9a9aa3; font-size: 12px; }
      label { display: block; margin: 10px 0 4px; color: #b7b7bf; font-size: 12px; }
      .field { margin: 8px 0 0; color: #b7b7bf; font-size: 12px; }
      .field .label { display: block; margin-bottom: 3px; }
      .field .range { display: flex; align-items: center; gap: 6px; color: #9a9aa3; }
      .field input {
        box-sizing: border-box;
        width: 64px;
        height: 26px;
        padding: 0 6px;
        border-radius: 7px;
        border: 1px solid #2e2e34;
        background: #1c1c21;
        color: #f2f2f4;
        font: inherit;
        font-size: 12px;
        text-align: center;
      }
      input[type="checkbox"] { width: 14px; height: 14px; accent-color: #d93a3f; }
      .check { display: flex; align-items: center; gap: 8px; margin-top: 10px; color: #d8d8de; }
      button {
        width: 100%;
        margin-top: 14px;
        height: 32px;
        border-radius: 9px;
        border: 1px solid #3a3a42;
        background: #232329;
        color: #fff;
        font: 600 12.5px/1 inherit;
        cursor: pointer;
      }
      button:hover { background: #2c2c34; }
      #status { margin-top: 8px; font-size: 11.5px; color: #8b8b93; min-height: 14px; }
    </style>
  </head>
  <body>
    <div class="brand">
      <img src="assets/icon-48.png" width="26" height="26" alt="" />
      <h1>Grok Library Cleaner</h1>
    </div>
    <p class="hint">Pick what Delete all touches, and how fast it works. Timing is randomised per item.</p>

    <div class="field">
      <span class="label">Wait between deletes</span>
      <div class="range">
        <input id="minDelay" type="number" min="300" step="50" aria-label="Fewest milliseconds between deletes" />
        <span>to</span>
        <input id="maxDelay" type="number" min="300" step="50" aria-label="Most milliseconds between deletes" />
        <span>ms</span>
      </div>
    </div>

    <div class="field">
      <span class="label">Long break every</span>
      <div class="range">
        <input id="every" type="number" min="2" step="1" aria-label="Fewest items between long breaks" />
        <span>to</span>
        <input id="everyMax" type="number" min="2" step="1" aria-label="Most items between long breaks" />
        <span>items</span>
      </div>
    </div>

    <div class="field">
      <span class="label">Break length</span>
      <div class="range">
        <input id="pause" type="number" min="1000" step="250" aria-label="Shortest long break in milliseconds" />
        <span>to</span>
        <input id="pauseMax" type="number" min="1000" step="250" aria-label="Longest long break in milliseconds" />
        <span>ms</span>
      </div>
    </div>

    <div class="check">
      <input id="includePlain" type="checkbox" />
      <label for="includePlain" style="margin: 0">Images (image.jpg)</label>
    </div>
    <div class="check">
      <input id="includeEdited" type="checkbox" />
      <label for="includeEdited" style="margin: 0">Edited images (edited-image.jpg)</label>
    </div>
    <div class="check">
      <input id="includeVideos" type="checkbox" />
      <label for="includeVideos" style="margin: 0">Videos (generated_video.mp4)</label>
    </div>
    <div class="check">
      <input id="includeOther" type="checkbox" />
      <label for="includeOther" style="margin: 0">Other files</label>
    </div>

    <div class="field">
      <span class="label">Delete at most</span>
      <div class="range">
        <input id="maxPerRun" type="number" min="0" step="10" aria-label="Most items per run, 0 for no limit" />
        <span>items per run</span>
      </div>
    </div>

    <div class="field">
      <span class="label">Skip files larger than</span>
      <div class="range">
        <input id="maxSizeMB" type="number" min="0" step="0.5" aria-label="Skip files larger than this many megabytes, 0 for no limit" />
        <span>MB</span>
      </div>
    </div>
    <p class="hint" style="margin: 6px 0 0">0 means no limit on either cap.</p>

    <button id="save">Save</button>
    <div id="status"></div>

    <script src="popup.js"></script>
  </body>
</html>
